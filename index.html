<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4">
<title>ふたりのホーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* テイスト「ふたつの空」（2026-11-03 社長が選択）
   主役はホームの2枚の空だけ。ほかは白い紙に細い線で静かにする。
   色は役割だけ：紺＝1人目、緑灰＝2人目、朱＝注意（期限切れ） */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --text:#1f2329; --sub:#69707a; --line:#e2e2de;
  --tk:#33506e; --mo:#6f9283; --warn:#b5542f; --warn-soft:#f6e6de;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; --num:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --surface:#1e2228; --text:#e9ecef; --sub:#9aa2ab; --line:#2c3138;
    --tk:#8fb0d6; --mo:#a9c7b9; --warn:#e8946f; --warn-soft:#3a2a23; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1e2228; --text:#e9ecef; --sub:#9aa2ab; --line:#2c3138;
  --tk:#8fb0d6; --mo:#a9c7b9; --warn:#e8946f; --warn-soft:#3a2a23; color-scheme:dark;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.6;overflow:hidden}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;font-weight:500}
.i{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
.muted{color:var(--sub);font-size:13px}
[hidden]{display:none !important}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--tk);outline-offset:2px}

/* 画面全体：スマホは画面いっぱい、PC は真ん中に1列 */
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* 上の帯：固定。見出しは置かず、その画面の操作だけ */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 8px;border-bottom:1px solid var(--line);min-height:54px;background:var(--bg)}
.hdr.clear{position:absolute;top:0;left:0;right:0;z-index:2;background:transparent;border-bottom:0;min-height:0;padding:0}
.mnav{display:flex;align-items:center;gap:2px}
.mnav b{font-family:var(--num);font-weight:500;font-size:18px;min-width:96px;text-align:center}
.icon-btn{border:0;background:none;color:var(--sub);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.seg{display:flex;gap:18px}
.seg button{border:0;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--sub);padding:6px 0;cursor:pointer;border-bottom:2px solid transparent}
.seg button.on{color:var(--text);border-bottom-color:var(--text)}
.seg .c{font-family:var(--num);font-weight:500;margin-left:4px}
.banner{background:var(--warn-soft);font-size:13px;padding:8px 18px}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pad{padding:6px 20px 0}
.sec{margin:0 0 26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--sub);margin:14px 0 2px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row.two{grid-template-columns:minmax(0,1fr) auto}
button.row{width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.row .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:1px}
.k{color:var(--sub);font-size:14px}
.empty{color:var(--sub);font-size:14px;padding:14px 0}
.x{border:0;background:none;color:var(--sub);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;opacity:.6}

/* ホーム：ふたつの空 */
.skies{display:grid;grid-template-columns:1fr 1fr;height:min(50vh,400px);min-height:320px}
.sky{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 46px;display:flex;flex-direction:column;justify-content:space-between;transition:background-color .8s}
.sky .pl{font-size:13px;font-weight:700}
.sky .t{font-family:var(--num);font-weight:300;font-size:min(23vw,92px);line-height:.85;letter-spacing:-.03em}
.sky .s{font-size:13px;line-height:1.5}
.seam{position:relative;height:0}
.datepill{position:absolute;left:18px;right:18px;top:0;transform:translateY(-50%);background:var(--bg);border-radius:999px;padding:9px 20px;display:flex;justify-content:space-between;align-items:baseline;font-weight:700;box-shadow:0 0 0 1px var(--line)}
.datepill b{font-family:var(--num);font-weight:600;font-size:21px}
.home-list{padding:34px 20px 0}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;flex:none}
.av.p1{background:var(--tk)} .av.p2{background:var(--mo)} .av.both{background:linear-gradient(90deg,var(--tk) 50%,var(--mo) 50%)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;vertical-align:1px}
.dot.p1{background:var(--tk)} .dot.p2{background:var(--mo)}
.split{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:10px}
.split span:first-child{background:var(--tk)} .split span:last-child{background:var(--mo)}

/* ToDo */
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0}
.chk.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.done .t{text-decoration:line-through;color:var(--sub)}
.late{color:var(--warn);font-weight:700}
.todo-r{display:flex;align-items:center;gap:4px}

/* 家計簿 */
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:14px 0 14px;border-bottom:1px solid var(--line)}
.totals small{display:block;font-size:12px;color:var(--sub)}
.totals b{font-family:var(--num);font-weight:500;font-size:22px}
.pm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--sub)}
.amt{text-align:right}
.amt .num{font-size:17px}
.amt small{display:block;font-size:11px;color:var(--sub);white-space:nowrap}
.tag{font-size:11px;color:var(--sub)}
.big{font-family:var(--num);font-weight:300;font-size:56px;line-height:1;text-align:center;margin:8px 0}
.dir{text-align:center;font-weight:700;margin-bottom:18px}
.dir .dot{margin:0 6px}

/* カレンダー */
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;padding:6px 14px 0}
.grid7 .w{font-size:12px;color:var(--sub);padding:4px 0 6px}
.cd{aspect-ratio:1/1;min-width:0;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--num);font-size:16px;border-radius:50%;cursor:pointer}
.cd.out{opacity:.3}
.cd.sel{box-shadow:inset 0 0 0 1.5px var(--text)}
.cd.today{background:var(--text);color:var(--bg)}
.cd .ds{display:flex;gap:3px;height:5px}
.cd .ds i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block;opacity:.7}

/* 設定 */
.mini{border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* 下のナビ：アイコンだけ */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;color:var(--sub);height:50px;display:grid;place-items:center;cursor:pointer;position:relative}
.nav button.on{color:var(--text)}
.nav button.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--text)}
.nav .plus{position:absolute;top:8px;right:calc(50% - 20px);width:14px;height:14px;border-radius:50%;background:var(--text);color:var(--bg);display:none;place-items:center}
.nav .plus svg{width:10px;height:10px;stroke-width:3}
.nav button.on.addable .plus{display:grid}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 下から出るシート */
.sheet-bg{position:fixed;inset:0;background:rgba(15,18,22,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:90%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:900}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
.fld input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
.two-c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:0;border-radius:14px;background:var(--text);color:var(--bg);font:inherit;font-weight:700;font-size:15px;padding:13px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.photo{display:flex;align-items:center;justify-content:center;gap:10px;min-height:80px;border:1px dashed var(--sub);border-radius:14px;color:var(--sub);font-weight:700;margin:0 0 14px;cursor:pointer;overflow:hidden;position:relative}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo img{display:block;max-width:100%;max-height:260px}
.receipt img{display:block;width:100%;border-radius:12px;margin:0 0 14px}
.item{padding:11px 0;border-bottom:1px solid var(--line)}
.item .top{display:flex;justify-content:space-between;gap:8px}
.ratio{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ratio button{border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;cursor:pointer}
.ratio button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.range{margin:8px 0 4px}
.range input{width:100%;accent-color:var(--tk)}
.range .lbl{display:flex;justify-content:space-between;font-size:13px}
.chk-l{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 14px}

/* 合言葉・読み込み中・お知らせ */
.cover{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.cover .box{width:100%;max-width:360px}
.cover h1{font-size:20px;font-weight:900;margin:0 0 6px}
.cover p{color:var(--sub);font-size:14px;margin:0 0 16px}
.cover input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.cover .who-btns{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:40;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.sky,.toast{transition:none}}
</style>
</head>
<body>

<div class="cover" id="loading"><div class="box muted" style="text-align:center">読み込んでいます…</div></div>

<div class="cover" id="login" hidden>
  <div class="box">
    <form id="loginForm" hidden>
      <h1>ふたりのホーム</h1>
      <p>合言葉を入れてください。スプレッドシートの「設定」シートに書いてあります。</p>
      <input id="loginPass" type="password" autocomplete="off" placeholder="合言葉" aria-label="合言葉">
      <button class="btn" type="submit">入る</button>
    </form>
    <div id="whoAsk" hidden>
      <h1>どちらですか？</h1>
      <p>家計簿や ToDo で「自分」として使います。あとから設定で変えられます。</p>
      <div class="who-btns" id="whoBtns"></div>
    </div>
  </div>
</div>

<div class="app">
  <div class="banner" id="banner" hidden></div>
  <header class="hdr" id="hdr"></header>
  <main class="body" id="body">
    <section id="v-home"></section>
    <section id="v-todo" hidden></section>
    <section id="v-money" hidden></section>
    <section id="v-cal" hidden></section>
    <section id="v-set" hidden></section>
  </main>
  <nav class="nav" id="nav" aria-label="画面の切り替え">
    <button data-v="home" class="on" type="button"><svg class="i" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="sr">ホーム</span></button>
    <button data-v="todo" class="addable" type="button"><svg class="i" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg><span class="plus"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="sr">ToDo（開いているときにもう一度押すと追加）</span></button>
    <button data-v="money" class="addable" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span class="plus"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="sr">家計簿（開いているときにもう一度押すと入力）</span></button>
    <button data-v="cal" type="button"><svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span class="sr">カレンダー</span></button>
    <button data-v="set" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span class="sr">設定</span></button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  /* ---------- 小さな道具 ---------- */
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function yen(n){ return '¥' + Math.round(n || 0).toLocaleString('ja-JP'); }
  var WD = ['日','月','火','水','木','金','土'];
  var today = new Date(); today.setHours(0,0,0,0);
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function fromIso(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function md(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
  function ymOf(d){ return iso(d).slice(0,7); }
  var todayIso = iso(today);

  /* ---------- データ係（Code.gs）の住所 ----------
     Apps Script の「デプロイを管理」に出ている ウェブアプリの URL。
     デプロイを「新バージョン」で更新しているかぎり変わらない */
  var APP_VER = '画面 第5版（ふたつの空）';
  var API_URL = 'https://script.google.com/macros/s/AKfycbyLvq9crZc7WOE-CNM_CXekWQAnvQe7OoHsfZT_YbrGJOdCxaS9KYJJ0zEtZAZzGaM1iQ/exec';

  /* ---------- 合言葉と「自分はだれか」 ----------
     専用URLは …/futari-home/#key=合言葉&me=名前 の形。
     # のうしろはサーバーに送られないので、GitHub の記録に合言葉が残らない */
  var IS_DEMO = location.protocol === 'file:' || /[?&]demo\b/.test(location.search); // お試しモード（保存されない）
  function load(k){ try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function hashParam(k){
    var m = location.hash.replace(/^#/, '').split('&').filter(function(p){ return p.split('=')[0] === k; })[0];
    if (!m) return '';
    try { return decodeURIComponent(m.slice(k.length + 1)); } catch(e) { return ''; }
  }
  var KEY = hashParam('key') || load('futari-key');
  var ME = hashParam('me') || load('futari-me');
  if (hashParam('key')) save('futari-key', KEY);
  if (hashParam('me')) save('futari-me', ME);
  function personalUrl(name){ return location.origin + location.pathname + '#key=' + encodeURIComponent(KEY) + '&me=' + encodeURIComponent(name); }

  /* ---------- データ係を呼ぶ。合言葉を毎回つける ----------
     credentials:'omit' で Google のログイン情報を送らない（アカウントが複数あっても迷わない）。
     本文を文字列で送ると、ブラウザの事前確認が入らずに届く */
  function call(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    if (IS_DEMO) return new Promise(function(ok, ng){ try { ok(DEMO[fn].apply(null, args)); } catch(e) { ng(e); } });
    var key = fn === 'login' ? args.shift() : KEY;
    return fetch(API_URL, { method:'POST', credentials:'omit', redirect:'follow', body: JSON.stringify({ fn: fn, key: key, args: args }) })
      .then(function(r){ if (!r.ok) throw new Error('データ係につながりませんでした（' + r.status + '）'); return r.json(); },
            function(){ throw new Error('つながりませんでした。電波を確かめて、もう一度試してください'); })
      .then(function(res){ if (!res || !res.ok) throw new Error((res && res.error) || 'うまくいきませんでした'); return res.data; });
  }
  var toastTimer;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600); }
  function fail(e){ toast((e && e.message) ? e.message.replace(/^Error:\s*/, '') : 'うまくいきませんでした'); }

  /* ---------- 状態 ---------- */
  var S = {
    v:'home', names:['',''], cardPayer:'', gomi:{}, server:'', todos:[], expenses:[], monthExpenses:[], events:[], homeEvents:[],
    todoTab:'open', moneyTab:'list', moneyMonth:new Date(today.getFullYear(), today.getMonth(), 1),
    viewMonth:new Date(today.getFullYear(), today.getMonth(), 1), selected:today, calOk:false
  };
  var BOTH = 'ふたり';
  var CATS = ['外食','食材','日用品','おでかけ','家賃・光熱','その他'];
  var CARD = '共有カード';
  function gridRange(m){ var start = addDays(m, -m.getDay()); return { start: iso(start), end: iso(addDays(start, 42)), startDate: start }; }

  /* ---------- 負担の計算 ----------
     割合はすべて「1人目（たくや）の負担 %」。空なら半々。
     品目があるときは品目ごとの割合で割り、合計が領収書の金額とずれる分（税など）は同じ比で配る */
  function itemPct(x, it){
    if (it.r != null && it.r !== '') return Number(it.r);
    if (it.cat === '食材') return x.food != null ? x.food : 50;
    if (it.cat === 'お酒') return 90;
    return 50;
  }
  function p1Of(x){
    var items = x.items || [];
    var sum = items.reduce(function(s, it){ return s + (Number(it.amt) || 0); }, 0);
    if (sum > 0) return items.reduce(function(s, it){ return s + (Number(it.amt) || 0) * itemPct(x, it) / 100; }, 0) * x.amount / sum;
    return x.amount * (x.tk != null ? x.tk : 50) / 100;
  }
  function paidBy(x){ return x.payer === CARD ? S.cardPayer : x.payer; }
  function sums(list){
    var s = { total:0, card:0, p1:0, paid1:0, paid2:0 };
    list.forEach(function(x){
      s.total += x.amount; s.p1 += p1Of(x);
      if (x.payer === CARD) s.card += x.amount;
      if (paidBy(x) === S.names[0]) s.paid1 += x.amount; else if (paidBy(x) === S.names[1]) s.paid2 += x.amount;
    });
    s.p2 = s.total - s.p1;
    s.diff = s.p2 - s.paid2; // プラスなら 2人目 → 1人目 に払う
    return s;
  }

  /* ---------- 空と天気（Open-Meteo：無料・登録なし。画面から直接もらう） ---------- */
  var PLACES = [{ pl:'箕面', lat:34.83, lon:135.47 }, { pl:'膳所', lat:35.00, lon:135.87 }];
  var WX = null;
  function wxName(c){ return c<=1?'晴れ':c<=3?'くもり':(c===45||c===48)?'霧':(c>=71&&c<=86)?'雪':c>=95?'雷雨':c>=61?'雨':'小雨'; }
  // 空の色：時刻と天気で1色を決める（飾りではなく、いまの空の情報）
  function sky(code){
    var H = new Date().getHours(), night = H < 5 || H >= 19, dusk = H >= 16 && H < 19, rain = code >= 51, cloud = code >= 2 && code < 51;
    if (night) return rain ? ['#2a3038','#d9dee5'] : cloud ? ['#262b36','#dfe3ea'] : ['#16203a','#e8ecf6'];
    if (dusk) return rain ? ['#6f7480','#f3f4f7'] : cloud ? ['#9d8f8a','#1f2329'] : ['#e7a66b','#2a1d12'];
    return rain ? ['#8a96a1','#16202a'] : cloud ? ['#b7c0c8','#1f2329'] : ['#86b8de','#0f2236'];
  }
  function fetchWx(){
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + PLACES.map(function(p){ return p.lat; }).join(',') + '&longitude=' + PLACES.map(function(p){ return p.lon; }).join(',') +
      '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=1';
    fetch(u).then(function(r){ return r.json(); }).then(function(a){
      WX = a.map(function(p){ return { t:p.current.temperature_2m, code:p.current.weather_code, hi:p.daily.temperature_2m_max[0], lo:p.daily.temperature_2m_min[0], r:p.daily.precipitation_probability_max[0] }; });
      if (S.v === 'home') renderHome();
    }).catch(function(){});
  }
  // 設定シートの「ゴミの日」：月:燃えるごみ,木:燃えるごみ,水:プラスチック
  function parseGomi(s){
    var g = {};
    String(s || '').split(/[,、，]/).forEach(function(p){ var m = p.split(/[:：]/); var i = WD.indexOf((m[0] || '').trim().charAt(0)); if (i >= 0 && m[1]) g[i] = (g[i] ? g[i] + '・' : '') + m[1].trim(); });
    return g;
  }

  /* ---------- ToDo ---------- */
  function sortTodos(a, b){

  function avOf(w){

  function todoRow(t){
    var late = !t.done && t.due && t.due < todayIso, w = '';

      '<div class="two-c"><label class="fld"><span>日付（なくてもよい）</span><input type="date" id="nD"></label><label class="fld"><span>時間（なくてもよい）</span><input type="time" id="nM"></label></div>' +

  // 写真はスマホの中で小さくしてから送る（通信と Drive の容量を軽くする）
  function shrink(file){
    return new Promise(function(ok, ng){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); ng(new Error('写真を読み込めませんでした')); };
      img.src = url;
    });
  }
  function rangeHtml(key, v){

  /* ---------- 画面の切り替えとシート ---------- */
  var R = { home:renderHome, todo:renderTodo, money:renderMoney, cal:renderCal, set:renderSet };
  function go(v){
    S.v = v; ['home','todo','money','cal','set'].forEach(function(x){ $('v-' + x).hidden = x !== v; });

  document.addEventListener('click', function(e){
    var b = e.target.closest('button, a[data-reopen], .sheet-bg'); if (!b) return;
    if (b.id === 'sheetBg'){ if (e.target === b) closeSheet(); return; }

      if (d.v === S.v && d.v === 'todo') return todoSheet();
      if (d.v === S.v && d.v === 'money') return moneySheet();
      return go(d.v);
    }
    if (b.parentNode && b.parentNode.dataset && b.parentNode.dataset.pick){ b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); return; }
    if (d.todo){ S.todoTab = d.todo; renderHdr(); renderTodo(); return; }
    if (d.mt){ S.moneyTab = d.mt; renderHdr(); renderMoney(); return; }
    if (d.m){
      if (d.mk === 'money'){ S.moneyMonth = new Date(S.moneyMonth.getFullYear(), S.moneyMonth.getMonth() + (+d.m), 1); renderHdr(); loadMoney(); }
      else { S.viewMonth = new Date(S.viewMonth.getFullYear(), S.viewMonth.getMonth() + (+d.m), 1); renderHdr(); renderCal(); loadEvents(); }
      return;
    }
    if (d.tg){
      var t = S.todos.filter(function(x){ return x.id === d.tg; })[0];
      if (t) { t.done = !t.done; R[S.v](); renderHdr(); } // 先に見た目を変えて、待たせない
      call('toggleTodo', d.tg).then(setTodos).catch(function(err){ fail(err); call('getTodos').then(setTodos); });
      return;

    if (d.ex) return exSheet(d.ex);
    if (d.ir != null && cur){
      var items = cur.items.map(function(it){ return { n: it.n, amt: it.amt, cat: it.cat, r: it.r }; });
      items[+d.ik].r = +d.ir; cur.items = items;
      b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
      paintSplit(); saveEx({ items: items }); return;
    }
    if (d.act === 'delEx'){
      if (cur && confirm('この記録を消しますか？')) call('deleteExpense', cur.id, ymOf(S.moneyMonth)).then(function(r){ closeSheet(); setExpenses(r); toast('消しました'); }).catch(fail);

      else prompt('長押しでコピーしてください', url);
      return;
    }

  });

      deleteTodo: function(i){ todos = todos.filter(function(t){ return t.id !== i; }); return copy(todos); },
      getExpenses: byMonth,
      addExpense: function(x){ money.push({ id:nid(), date:x.date, amount:x.amount, category:x.category, payer:x.payer, memo:x.memo, tk:x.tk, food:null, items:[], photo:'', read:false }); return byMonth(x.date.slice(0,7)); },
      updateExpense: function(i, p, ym){ var x = find(i); if (x) Object.keys(p).forEach(function(k){ if (k !== 'photo') x[k] = p[k]; }); return byMonth(ym); },
      deleteExpense: function(i, ym){ money = money.filter(function(x){ return x.id !== i; }); return byMonth(ym); },
      getPhoto: function(){ throw new Error('お試しモードでは写真は出ません'); },
      getEvents: function(){ return copy(evs); },
      addEvent: function(e){ evs.push({ id:nid(), title:e.title, allDay:e.allDay, start:e.date, end:e.date, time:e.allDay ? '終日' : e.start, endTime:e.allDay ? '' : e.end, recurring:false }); return copy(evs); },
      deleteEvent: function(i){ evs = evs.filter(function(e){ return e.id !== i; }); return copy(evs); }
    };
  })();

  fetchWx();
  if (!IS_DEMO && !KEY) showLogin(); else loadApp();
})();
</script>
